name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Tests (rules, exposure model, generator, Slack import)
        run: pytest -q
      - name: Benchmark smoke run (Python twin, no database or LLM)
        run: python scripts/bench.py --orgs 4 --sprints 2 --no-write
