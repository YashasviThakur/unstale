name: keep-awake

# The live demo runs on a free instance that sleeps after 15 idle minutes and takes about a minute to wake.
# Judging runs for about a week, so ping it every 10 minutes and nobody lands on a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the live demo (real HydraDB)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 https://unstale.onrender.com/api/meta) && [ "$code" = 200 ] && echo "up ($code)" && exit 0
            echo "attempt $i: $code"; sleep 20
          done
          exit 1
