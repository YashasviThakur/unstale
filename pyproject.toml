[project]
name = "unstale"
version = "0.1.0"
description = "Finds who is working from an old version of the truth, using a versioned context graph on HydraDB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "selfgraph @ git+https://github.com/hydra-db/selfgraph@main",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "kuzu>=0.6",          # embedded store for the hosted demo (Vercel cannot run a HydraDB server)
    "pydantic>=2.7",
]

[project.optional-dependencies]
baselines = ["fastembed>=0.4"]
mcp = ["mcp>=2.3"]               # the remote /mcp endpoint and unstale.mcp_server
dev = ["pytest>=8", "mcp>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["unstale"]
