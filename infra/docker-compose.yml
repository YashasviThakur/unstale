name: ${UNSTALE_STACK:-unstale-demo}

# Local HydraDB (open-source engine) backed by MinIO, since MERGE writes need
# conditional PUTs that the plain local-filesystem object store lacks.
# Secrets come from infra/.env (gitignored).
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: unstale
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    command: >
      -c "until mc alias set local http://minio:9000 unstale $$MINIO_PASSWORD; do sleep 1; done &&
          mc mb -p local/unstale-graph"

  hydradb-init:
    image: busybox:latest
    volumes:
      - hydradb-data:/data
    environment:
      HYDRA_TOKEN: ${HYDRA_TOKEN}
    entrypoint: /bin/sh
    command: >
      -c "mkdir -p /data/cache && printf '%s\n' \"$$HYDRA_TOKEN\" > /data/auth-token"

  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
      hydradb-init:
        condition: service_completed_successfully
    ports:
      - "17687:7687"
      - "18443:8443"
      - "19090:9090"
    volumes:
      - hydradb-data:/data
    environment:
      CLOUD_PROVIDER: aws
      AWS_BUCKET_NAME: unstale-graph
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000
      AWS_ALLOW_HTTP: "true"
      AWS_ACCESS_KEY_ID: unstale
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
      RUST_LOG: info

volumes:
  minio-data:
  hydradb-data:
